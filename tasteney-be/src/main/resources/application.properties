spring.application.name=tasteney-be
spring.profiles.active=DEV
spring.docker.compose.enabled=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Spring Session JDBC Configuration
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# Initial Admin Seeding Configuration
tasteney.admin.initial-email=administr.t.001@tasteney.com
tasteney.admin.initial-password=${INITIAL_ADMIN_PASSWORD:}
