<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>News - Tasteney Admin</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #111827;
            --surface-card: #1f2937;
            --border-color: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --badge-admin-bg: rgba(239, 68, 68, 0.2);
            --badge-admin-text: #fca5a5;
            --badge-user-bg: rgba(99, 102, 241, 0.2);
            --badge-user-text: #c7d2fe;
            --badge-active-bg: rgba(16, 185, 129, 0.2);
            --badge-active-text: #6ee7b7;
            --badge-inactive-bg: rgba(239, 68, 68, 0.2);
            --badge-inactive-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 0.875rem;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text-main);
            background-color: var(--surface-card);
        }

        .nav-link.active {
            color: #a5b4fc;
            background-color: rgba(99, 102, 241, 0.15);
            font-weight: 600;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-logout {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-logout:hover {
            color: #ef4444;
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.15s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.5rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.5rem;
            color: var(--text-main);
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .filter-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-input {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.875rem;
            border-radius: 6px;
            font-size: 0.875rem;
            width: 240px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .select-filter {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.875rem;
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
            cursor: pointer;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        .user-table th {
            background-color: rgba(31, 41, 55, 0.5);
            padding: 0.75rem 1.5rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        .user-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .user-table tbody tr:hover {
            background-color: rgba(31, 41, 55, 0.3);
        }

        .mono-id {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-active {
            background-color: var(--badge-active-bg);
            color: var(--badge-active-text);
        }

        .badge-inactive {
            background-color: var(--badge-inactive-bg);
            color: var(--badge-inactive-text);
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .table-footer {
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem !important;
            color: var(--text-muted);
            font-style: italic;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #6ee7b7;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <script>
        document.addEventListener('htmx:configRequest', function (evt) {
            const tokenMeta = document.querySelector('meta[name="_csrf"]');
            const headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (tokenMeta && headerMeta) {
                evt.detail.headers[headerMeta.getAttribute('content')] = tokenMeta.getAttribute('content');
            }
        });
    </script>
    <nav class="navbar">
        <div class="nav-left">
            <div class="brand-logo">Tasteney</div>
            <div class="nav-links">
                <a href="/admin/dashboard" class="nav-link">Dashboard</a>
                <a href="/admin/encyclopedia" class="nav-link">Encyclopedia</a>
                <a href="/admin/news" class="nav-link active">News</a>
                <a href="/admin/profile" class="nav-link">Profile</a>
            </div>
        </div>
        <div class="nav-actions">
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div th:if="${newsSuccess}" class="alert-success" th:text="${newsSuccess}"></div>
        <div th:if="${newsError}" class="alert-error" th:text="${newsError}"></div>

        <div class="page-header">
            <div>
                <h1 class="page-title">News Articles</h1>
                <p class="page-subtitle">Publish, edit, and deactivate short announcements and news updates.</p>
            </div>
            <a href="/admin/news/new" class="btn-primary">
                <span>+ Create News Article</span>
            </a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Articles</div>
                <div class="stat-value" th:text="${totalNews}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Articles</div>
                <div class="stat-value" th:text="${activeNews}">0</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Manage Articles</div>
                <div class="filter-controls">
                    <input type="text"
                           name="query"
                           class="search-input"
                           placeholder="Search news..."
                           th:value="${query}"
                           hx-get="/admin/htmx/news"
                           hx-trigger="keyup changed delay:300ms, search"
                           hx-target="#news-table-container"
                           hx-include="[name='status']">

                    <select name="status"
                            class="select-filter"
                            hx-get="/admin/htmx/news"
                            hx-trigger="change"
                            hx-target="#news-table-container"
                            hx-include="[name='query']">
                        <option value="ALL" th:selected="${selectedStatus == 'ALL'}">All Statuses</option>
                        <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Active Only</option>
                        <option value="INACTIVE" th:selected="${selectedStatus == 'INACTIVE'}">Inactive Only</option>
                    </select>
                </div>
            </div>

            <div th:replace="~{admin/fragments/news-table :: newsTable}"></div>
        </div>
    </div>
</body>
</html>
