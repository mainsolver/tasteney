spring.profiles.active=JUNIT
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
tasteney.admin.initial-email=admin-001@tasteney.com
tasteney.admin.initial-password=testAdminPassword123!
tasteney.app.base-url=http://localhost:8080
